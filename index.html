<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Autos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
<div class="container">
    <h1>Buscador de Autos</h1>
    <form id="searchForm">
        <div class="filters">
            <div class="filter-row">
            <div class="filter-group">
                <label for="marca">Marca</label>
            <select id="marca">
                <option value="">Seleccione</option>
            </select>
            </div>
            <div class="filter-group">
                <label for="año">Año</label>
            <select id="año">
                <option value="">Seleccione</option>
            </select>
            </div>
          <div class="filter-group">
            <label for="precioMin">Precio Min</label>
<input type="number" id="precioMin" placeholder="Precio Min">
</div>
<div class="filter-group">
    <label for="precioMax">Precio Max</label>
<input type="number" id="precioMax" placeholder="Precio Max">
</div>
<div class="filter-group">
    <label for="puertas">Puertas</label>
<select id="puertas">
    <option value="">Seleccione</option>
</select>
</div>
<div class="filter-group">
    <label for="transmision">Transmisión</label>
<select id="transmision">
<option value="">Seleccione</option>
<option value="Automatico">Automático</option>
<option value="Manual">Manual</option>
</select>
</div>
<div class="filter-group">
    <label for="color">Color</label>
<select id="color">
    <option value="">Seleccione</option>
    </select>
</div>
        </div>
        </div>
        <div class="actions">
            <button type="button" id="limpiar">Limpiar Filtros</button>
        </div>
    </form>
    <div id="resultados"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
